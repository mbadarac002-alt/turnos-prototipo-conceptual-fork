<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnos API</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#5f6b7a; --line:#d9dee5; --accent:#2457d6; --ok:#17794a; --bad:#b3261e; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121519; --card:#1b2026; --fg:#e8ecf1; --muted:#9aa6b4; --line:#2e353d; --accent:#7ea2ff; --ok:#5fd29b; --bad:#ff8a80; --warn:#f2c36b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:13px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:10px; }
  input { display:block; width:100%; margin-top:4px; padding:8px 10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#0b1220; } }
  button.sec { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:6px; border:1px solid var(--line); font-size:14px; }
  .msg.err { border-color:var(--bad); color:var(--bad); }
  .msg.ok { border-color:var(--ok); color:var(--ok); }
  .msg code { font-weight:600; }
  .row { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row:first-of-type { border-top:0; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid currentColor; }
  .badge.CONFIRMADO { color:var(--ok); } .badge.CANCELADO_CLIENTE { color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  .conn { font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Turnos</h1>
  <p class="sub">Cliente mínimo de la API (spec §11) · <span id="conn" class="conn">conectando…</span> · <span id="base"></span></p>

  <section>
    <h2>Nueva reserva</h2>
    <form id="form">
      <label>Nombre <input name="cliente_nombre" required minlength="2" maxlength="100" autocomplete="name"></label>
      <label>Email <input name="cliente_email" type="email" required autocomplete="email"></label>
      <label>Servicio <input name="servicio" required maxlength="100"></label>
      <label>Fecha y hora (tu hora local) <input name="fecha_hora" type="datetime-local" step="60" required></label>
      <button id="enviar" type="submit">Reservar</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <section>
    <h2>Turnos <button id="recargar" class="sec" type="button" style="float:right;padding:2px 10px">Recargar</button></h2>
    <div id="lista"><span class="muted">Cargando…</span></div>
  </section>
</main>

<script>
const API = (new URLSearchParams(location.search).get('api')) || 'http://localhost:8000';
const $ = (id) => document.getElementById(id);
$('base').textContent = API;

const fmt = (iso) => new Date(iso).toLocaleString('es-AR', { dateStyle: 'medium', timeStyle: 'short' });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function mostrar(tipo, html) { $('msg').innerHTML = `<div class="msg ${tipo}">${html}</div>`; }

// Errores del contrato §11.1: {detail:{code,message}} o, para forma inválida, detail como lista (FastAPI).
function errorTexto(status, body) {
  const d = body && body.detail;
  if (d && d.code) return `<code>${esc(d.code)}</code> (${status}) — ${esc(d.message)}`;
  if (Array.isArray(d)) return `<code>VALIDACION</code> (${status}) — ` + d.map((e) => esc((e.loc || []).slice(1).join('.') + ': ' + e.msg)).join('; ');
  return `Error ${status}`;
}

async function llamar(path, opts) {
  let r;
  try { r = await fetch(API + path, opts); }
  catch { throw { red: true }; }
  const body = await r.json().catch(() => null);
  if (!r.ok) throw { status: r.status, body };
  return body;
}

async function cargar() {
  try {
    const turnos = await llamar('/api/turnos');
    $('conn').textContent = '● conectado'; $('conn').style.color = 'var(--ok)';
    $('lista').innerHTML = turnos.length ? turnos.map((t) => `
      <div class="row">
        <div><strong>${esc(t.servicio)}</strong> · ${fmt(t.fecha_hora)}<br>
          <span class="muted">${esc(t.cliente_nombre)} · ${esc(t.cliente_email)}</span></div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="badge ${t.estado}">${t.estado}</span>
          <button class="sec" data-id="${esc(t.id)}" ${t.estado !== 'CONFIRMADO' ? 'disabled' : ''}>Cancelar</button>
        </div>
      </div>`).join('') : '<span class="muted">No hay turnos.</span>';
  } catch (e) {
    $('conn').textContent = '● sin conexión'; $('conn').style.color = 'var(--bad)';
    $('lista').innerHTML = '<span class="muted">No se pudo contactar al backend. ¿Está corriendo en ' + esc(API) + '?</span>';
  }
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const local = f.get('fecha_hora');
  const body = {
    cliente_nombre: f.get('cliente_nombre'),
    cliente_email: f.get('cliente_email'),
    servicio: f.get('servicio'),
    fecha_hora: local ? new Date(local).toISOString() : '',   // ISO 8601 UTC con zona (§11.1)
  };
  $('enviar').disabled = true;   // evita doble envío
  try {
    const t = await llamar('/api/turnos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    mostrar('ok', `Reserva confirmada (<code>${esc(t.estado)}</code>) para ${fmt(t.fecha_hora)}.`);
  } catch (e) {
    mostrar('err', e.red ? 'Sin conexión con el backend.' : errorTexto(e.status, e.body));
  } finally { $('enviar').disabled = false; cargar(); }
});

$('lista').addEventListener('click', async (ev) => {
  const id = ev.target.dataset && ev.target.dataset.id;
  if (!id) return;
  ev.target.disabled = true;
  try {
    const t = await llamar(`/api/turnos/${encodeURIComponent(id)}/cancelar`, { method: 'POST' });
    mostrar('ok', `Turno cancelado (<code>${esc(t.estado)}</code>).`);
  } catch (e) {
    mostrar('err', e.red ? 'Sin conexión con el backend.' : errorTexto(e.status, e.body));
  } finally { cargar(); }
});

$('recargar').addEventListener('click', cargar);
cargar();
</script>
</body>
</html>
